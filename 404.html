<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Página não encontrada — Portfólio Ytalo Lima</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('ytalo-portfolio-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="hero" style="min-height: 100svh; padding-top: 2rem;">
    <div class="container">
      <span class="section-index">ERRO 404 · ROTA INEXISTENTE</span>
      <h1 class="hero__title" style="margin-top: 1rem;">PÁGINA NÃO ENCONTRADA</h1>
      <p class="hero__description">
        O endereço solicitado não corresponde a nenhuma seção publicada neste portfólio. Utilize o atalho abaixo para retornar à página principal de Ytalo Lima.
      </p>
      <div class="hero__actions">
        <a class="btn btn--primary" href="index.html">Voltar ao portfólio principal</a>
        <a class="btn btn--secondary" href="index.html#athletix">Ir direto ao caso ATHLETIX</a>
      </div>
    </div>
  </main>
</body>
</html>
