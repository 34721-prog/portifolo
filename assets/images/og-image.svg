<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Portfólio de Ytalo Lima — engenharia de software e estudo de caso ATHLETIX">
  <defs>
    <pattern id="rail" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#2A2F28" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#080907"/>
  <rect width="1200" height="630" fill="url(#rail)" opacity="0.55"/>

  <!-- Moldura editorial -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#454B41" stroke-width="1"/>
  <path d="M40 40h22M40 40v22" stroke="#CDF564" stroke-width="2"/>
  <path d="M1160 590h-22M1160 590v-22" stroke="#CDF564" stroke-width="2"/>

  <!-- Cabeçalho do documento -->
  <rect x="72" y="70" width="10" height="10" fill="#CDF564"/>
  <text x="96" y="81" fill="#F1EEE3" font-family="monospace" font-size="15" letter-spacing="3.4">PORTFÓLIO · ENGENHARIA DE SOFTWARE</text>
  <text x="1112" y="81" text-anchor="end" fill="#8D9285" font-family="monospace" font-size="14" letter-spacing="2.6">BRASIL · PT-BR</text>
  <line x1="72" y1="110" x2="1128" y2="110" stroke="#2A2F28" stroke-width="1"/>

  <!-- Assinatura -->
  <text x="66" y="272" fill="#F1EEE3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="132" font-weight="500" letter-spacing="-4">YTALO</text>
  <text x="66" y="392" fill="#F1EEE3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="132" font-weight="500" letter-spacing="-4">LIMA</text>
  <circle cx="378" cy="370" r="17" fill="#F08A5D"/>

  <line x1="72" y1="432" x2="640" y2="432" stroke="#454B41" stroke-width="1"/>
  <text x="72" y="468" fill="#CDF564" font-family="monospace" font-size="17" letter-spacing="2.4">DESENVOLVEDOR DE SOFTWARE EM FORMAÇÃO</text>
  <text x="72" y="504" fill="#B6B9AC" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="21">Transformando curiosidade em tecnologia,</text>
  <text x="72" y="534" fill="#B6B9AC" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="21">ideias em sistemas e aprendizado em projetos reais.</text>

  <!-- Cartão do estudo de caso -->
  <rect x="790" y="150" width="338" height="330" fill="#131612" stroke="#454B41" stroke-width="1"/>
  <path d="M790 150h26M790 150v26" stroke="#CDF564" stroke-width="2"/>
  <text x="818" y="186" fill="#F08A5D" font-family="monospace" font-size="13" letter-spacing="2.4">ESTUDO DE CASO PRINCIPAL</text>
  <text x="816" y="238" fill="#F1EEE3" font-family="'Space Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="500" letter-spacing="-1.5">ATHLETIX</text>
  <line x1="818" y1="266" x2="1100" y2="266" stroke="#2A2F28" stroke-width="1"/>
  <text x="818" y="300" fill="#B6B9AC" font-family="monospace" font-size="14" letter-spacing="1.2">317 EXERCÍCIOS · 4 IDIOMAS</text>
  <text x="818" y="328" fill="#B6B9AC" font-family="monospace" font-size="14" letter-spacing="1.2">REACT 18 · TYPESCRIPT · VITE</text>
  <text x="818" y="356" fill="#B6B9AC" font-family="monospace" font-size="14" letter-spacing="1.2">SUPABASE · POSTGRESQL + RLS</text>
  <text x="818" y="384" fill="#B6B9AC" font-family="monospace" font-size="14" letter-spacing="1.2">PWA · VITEST · PLAYWRIGHT</text>
  <rect x="818" y="414" width="104" height="6" fill="#CDF564"/>
  <text x="818" y="452" fill="#8D9285" font-family="monospace" font-size="12" letter-spacing="1.8">PRODUTO PUBLICADO NA VERCEL</text>

  <!-- Rodapé -->
  <line x1="72" y1="558" x2="1128" y2="558" stroke="#2A2F28" stroke-width="1"/>
  <text x="72" y="584" fill="#8D9285" font-family="monospace" font-size="13" letter-spacing="2">HTML5 · CSS3 · JAVASCRIPT ES6+ · PORTFÓLIO AUTORAL</text>
  <text x="1128" y="584" text-anchor="end" fill="#F1EEE3" font-family="monospace" font-size="13" letter-spacing="1.4">github.com/ytalo6411-art</text>
